dataset: tinystories
run_name: tinystories

paths:
  checkpoint: checkpoints/tinystories/checkpoint.pt
  tokenizer: data/tinystories/tokenizer/model.pkl

model:
  vocab_size: 10000
  context_length: 256
  d_model: 512
  num_layers: 4
  num_heads: 16
  d_ff: 1344
  rope_theta: 10000.0

generation:
  prompt: "Once upon a time"
  max_tokens: 100
  temperature: 0.8
  top_k: null
  top_p: 0.1

device: mps
