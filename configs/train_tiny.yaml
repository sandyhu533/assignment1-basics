# TinyStories training config (small, fast)
input_file: data/_serialized/tinystories_train.npy
checkpoint_dir: ckpt
load_checkpoint: 0

batch_size: 32
context_length: 128
d_model: 256
num_layers: 4
num_heads: 4
d_ff: null  # default: 4*d_model//3
rope_theta: 10000.0

train_steps: 1000
lr: 0.001
b1: 0.9
b2: 0.99
weight_decay: 0.01
eps: 1.0e-8

device: cpu
